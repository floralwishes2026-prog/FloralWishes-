<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colecția Premium - Flori</title>
  <style>
    /* Resetare de bază */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #24131b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Secțiunea Hero optimizată pentru telefon */
    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;

      width: 100%;
      height: 100vh; /* Ocupă tot ecranul vertical */
      padding: 32px 24px;

      overflow: hidden;
      color: #fff;

      background-color: #24131b;
      background-image:
        linear-gradient(
          180deg,
          rgba(24, 5, 14, 0.75) 0%,
          rgba(35, 8, 20, 0.85) 100%
        ),
        url("https://images.unsplash.com/photo-1494972308805-463bc619d34e?auto=format&fit=crop&w=1000&q=85");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-content {
      position: relative;
      width: 100%;
      max-width: 100%;
      z-index: 2;
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;

      color: #ffb6c8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0 0 16px 0;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      line-height: 1.15;
      font-weight: 700;
    }

    .hero h1 span {
      display: block;
      color: #ff718f;
      font-style: italic;
    }

    .hero p {
      margin: 0 0 24px 0;

      color: #f4dfe5;
      font-size: 16px;
      line-height: 1.6;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 48px;
      width: 100%; /* Buton lat, ușor de apăsat pe telefon */
      padding: 14px 24px;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;

      background: linear-gradient(135deg, #ff5478, #bd123e);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 15px;
      font-weight: 700;

      box-shadow: 0 8px 25px rgba(189, 18, 62, 0.4);
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <span class="badge">🌹 COLECȚIA PREMIUM</span>

      <h1>
        Flori care spun
        <span>mai mult decât cuvintele.</span>
      </h1>

      <p>
        Trandafiri spectaculoși, buchete elegante
        și momente care rămân în suflet.
      </p>

      <a href="#produse" class="hero-btn">
        Descoperă colecția ✨
      </a>
    </div>
  </section>

</body>
</html><!--  -->
