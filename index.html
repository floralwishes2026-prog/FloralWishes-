<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maison Rosé - Trandafiri și Buchete din Săpun</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #12050b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(18, 5, 11, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff5478;
    }

    .phone-top {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffb6c8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 182, 200, 0.2);
    }

    .hero {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 100px 20px 110px 20px;

      background-color: #12050b;
      background-image:
        linear-gradient(
          180deg,
          rgba(18, 5, 11, 0.3) 0%,
          rgba(24, 5, 14, 0.8) 60%,
          rgba(18, 5, 11, 0.98) 100%
        ),
        url("https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=1000&q=85");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .hero-content {
      width: 100%;
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 10px;
      background: rgba(255, 113, 143, 0.2);
      border: 1px solid rgba(255, 113, 143, 0.4);
      border-radius: 12px;
      color: #ffb6c8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero h1 {
      margin-bottom: 12px;
      font-family: Georgia, serif;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .hero h1 span {
      display: block;
      color: #ff718f;
      font-style: italic;
    }

    .hero p {
      margin-bottom: 20px;
      color: #f4dfe5;
      font-size: 15px;
      line-height: 1.5;
      opacity: 0.95;
    }

    .bottom-actions {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 20px 16px;
      background: rgba(18, 5, 11, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .btn {
      flex: 1;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff5478, #bd123e);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(255, 84, 120, 0.4);
      border: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="logo">Maison <span>Rosé</span></div>
    <a href="tel:0734287072" class="phone-top">
      📞 0734 287 072
    </a>
  </header>

  <section class="hero">
    <div class="hero-content">
      <span class="badge">🧼 COLECȚIA DE LUX DIN SĂPUN</span>

      <h1>
        Aranjamente florale din săpun
        <span>care nu se andurează niciodată.</span>
      </h1>

      <p>
        Trandafiri parfumați din săpun care rezistă o veșnicie. Cadoul perfect pentru orice moment special.
      </p>
    </div>
  </section>

  <div class="bottom-actions">
    <a href="tel:0734287072" class="btn btn-secondary">
      📞 Sună Acum
    </a>
    <a href="produse.html" class="btn btn-primary">
      🛍️ Vezi Colecția & Prețuri
    </a>
  </div>

</body>
</html><!--  -->
