<!-- <!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colecția Premium - Flori</title>
  <style>
    /* Eliminăm orice spațiu implicit și obligăm pagina să ocupe tot ecranul */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #24131b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Setăm body-ul ca un container Flex complet */
    body {
      display: flex;
      flex-direction: column;
    }

    /* Secțiunea Hero se întinde automat (flex: 1) pe tot spațiul rămas liber */
    .hero {
      flex: 1;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;
      color: #ffffff;

      background-color: #24131b;
      background-image:
        linear-gradient(
          180deg,
          rgba(24, 5, 14, 0.75) 0%,
          rgba(35, 8, 20, 0.88) 100%
        ),
        url("https://images.unsplash.com/photo-1494972308805-463bc619d34e?auto=format&fit=crop&w=1000&q=85");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-content {
      width: 100%;
      text-align: left;
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;

      color: #ffb6c8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero h1 {
      margin-bottom: 14px;

      font-family: Georgia, serif;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 700;
    }

    .hero h1 span {
      display: block;
      color: #ff718f;
      font-style: italic;
    }

    .hero p {
      margin-bottom: 24px;

      color: #f4dfe5;
      font-size: 15px;
      line-height: 1.5;
    }

    .hero-btn {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      padding: 15px 0;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;

      background: linear-gradient(135deg, #ff5478, #bd123e);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;

      box-shadow: 0 8px 25px rgba(189, 18, 62, 0.4);
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <span class="badge">🌹 COLECȚIA PREMIUM</span>

      <h1>
        Flori care spun
        <span>mai mult decât cuvintele.</span>
      </h1>

      <p>
        Trandafiri spectaculoși, buchete elegante
        și momente care rămân în suflet.
      </p>

      <a href="#produse" class="hero-btn">
        Descoperă colecția ✨
      </a>
    </div>
  </section>

</body>
</html>
